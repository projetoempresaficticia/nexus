# Backup diário do Supabase para o Google Drive partilhado (docs/BACKUP.md).
# 1. dump oficial do Supabase (pg_dump na mesma versão do servidor): usuários, estrutura e dados;
# 2. TESTA o restauro num Supabase local e compara as linhas de cada tabela;
# 3. comprime (gzip) e encripta (GPG simétrico AES256);
# 4. envia ao Drive e aplica a retenção (30 diários + o 1.º de cada mês por 12 meses).
# Qualquer erro falha o job — o GitHub avisa por e-mail quem editou este arquivo por último.
# Job "anexos": aos domingos, copia os arquivos do Storage (bucket anexos) → tar + GPG → Drive
# (8 semanas + 1 por mês por 12 meses). Opcional: sem os secrets SUPABASE_S3_* só avisa.
name: Backup Supabase

on:
  schedule:
    # 03:00 em Lisboa: 02:00 UTC no verão, 03:00 UTC no inverno. Roda nos dois horários
    # e o passo "Hoje já tem backup?" deixa passar só o primeiro depois das 3h de Lisboa.
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Conferir segredos e esconder a senha do banco nos logs
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for nome in SUPABASE_DB_URL BACKUP_PASSPHRASE GDRIVE_SERVICE_ACCOUNT_JSON GDRIVE_FOLDER_ID; do
            if [ -z "${!nome}" ]; then echo "::error::Secret $nome não configurado (ver docs/BACKUP.md)"; exit 1; fi
          done
          # A URL inteira já é mascarada pelo GitHub; a senha sozinha também precisa ser.
          senha="${SUPABASE_DB_URL#*://*:}"; senha="${senha%%@*}"
          echo "::add-mask::$senha"
          # Pastas temporárias do runner (fora do repositório), para os passos seguintes
          echo "TRABALHO=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"
          echo "GDRIVE_SA_ARQUIVO=$RUNNER_TEMP/conta-servico.json" >> "$GITHUB_ENV"
          TRABALHO="$RUNNER_TEMP/backup"; GDRIVE_SA_ARQUIVO="$RUNNER_TEMP/conta-servico.json"
          umask 077
          mkdir -p "$TRABALHO"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$GDRIVE_SA_ARQUIVO"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependências do envio ao Drive
        run: pip install --quiet -r scripts/backup/requirements.txt

      - name: Hoje já tem backup?
        id: guarda
        run: |
          set -euo pipefail
          dia=$(TZ=Europe/Lisbon date +%F)
          hora=$(TZ=Europe/Lisbon date +%-H)
          nome="nexus-backup-$dia.sql.gz.gpg"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$hora" -lt 3 ]; then
              echo "Ainda não são 3h em Lisboa ($hora h); a execução seguinte faz o backup."
              echo "fazer=nao" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$(python scripts/backup/drive.py existe "$nome")" = "sim" ]; then
              echo "O backup de $dia já está no Drive."
              echo "fazer=nao" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "fazer=sim" >> "$GITHUB_OUTPUT"

      - name: Instalar cliente PostgreSQL 17 (mesma versão do servidor)
        if: steps.guarda.outputs.fazer == 'sim'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: supabase/setup-cli@v3
        if: steps.guarda.outputs.fazer == 'sim'
        with:
          version: 2.121.0

      - name: Dump do banco (estrutura e dados; roles ficam de fora)
        if: steps.guarda.outputs.fazer == 'sim'
        run: |
          set -euo pipefail
          cd "$TRABALHO"
          # pg_dump DIRETO, não "supabase db dump": esse comando da CLI troca para o papel "postgres"
          # por dentro, e o papel de leitura backup_leitura (de propósito, sem esse poder) é recusado
          # com "permission denied to set role postgres" (docs.supabase.com, troubleshooting de pg_dump
          # com role restrito). Como backup_leitura também não lê pg_authid, roles não entram no backup —
          # um projeto novo já nasce com os papéis padrão; o restauro (BACKUP.md §6) parte sempre de um.
          # Estrutura: só os schemas do Nexus (public, privado). auth/storage/extensões já existem
          # prontos em qualquer projeto novo — não precisam ser recriados, só repovoados com os dados.
          pg_dump "$SUPABASE_DB_URL" --schema-only -n public -n privado -f schema.sql
          # Dados: Nexus + auth (para as pessoas conseguirem entrar) + storage (imagens coladas).
          # Fora: tabelas de Vectors (não usamos) e os schemas operacionais (net/cron/vault/realtime) —
          # crescem a cada chamada e são recriados ao reaplicar supabase/agendamentos.sql (BACKUP.md §6).
          # Sem --inserts: o pg_dump já usa COPY por padrão (mais rápido e compacto que INSERT).
          pg_dump "$SUPABASE_DB_URL" --data-only \
            -n public -n privado -n auth -n storage \
            --exclude-table=storage.buckets_vectors --exclude-table=storage.vector_indexes \
            -f data.sql
          # "public" já existe em qualquer projeto novo (ou no banco local do teste abaixo); sem o
          # IF NOT EXISTS, restaurar falha com "schema public already exists" antes de criar qualquer
          # tabela. "privado" continua sendo criado normalmente (IF NOT EXISTS não muda nada pra ele).
          sed -i -E 's/^CREATE SCHEMA ([A-Za-z0-9_."]+);/CREATE SCHEMA IF NOT EXISTS \1;/' schema.sql
          # Um único arquivo que se restaura com um psql (passo a passo em docs/BACKUP.md)
          {
            cat schema.sql
            echo 'SET session_replication_role = replica;'
            cat data.sql
          } > nexus.sql
          rm schema.sql data.sql
          # Linhas por tabela no banco de origem, para comparar depois do restauro
          psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            select format('select %L || ''|'' || count(*) from %I.%I;', schemaname || '.' || relname, schemaname, relname)
            from pg_stat_user_tables where schemaname = 'public' order by 1" > contagem.sql
          psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -f contagem.sql > origem.txt
          echo "Dump: $(du -h nexus.sql | cut -f1), $(wc -l < origem.txt) tabelas em public."

      - name: Testar o restauro num Supabase local
        if: steps.guarda.outputs.fazer == 'sim'
        run: |
          set -euo pipefail
          mkdir -p "$TRABALHO/teste" && cd "$TRABALHO/teste"
          supabase init > /dev/null
          supabase db start
          local_url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$local_url" -X -q --single-transaction -v ON_ERROR_STOP=1 -f "$TRABALHO/nexus.sql" > /dev/null
          psql "$local_url" -X -A -t -v ON_ERROR_STOP=1 -f "$TRABALHO/contagem.sql" > "$TRABALHO/restaurado.txt"
          # Só nomes de tabelas e números: nada de conteúdo
          if ! diff -u "$TRABALHO/origem.txt" "$TRABALHO/restaurado.txt"; then
            echo "::warning::Linhas diferentes entre origem e restauro (escritas durante o backup?). Ver acima."
          fi
          faltam=$(join -v1 <(cut -d'|' -f1 "$TRABALHO/origem.txt" | sort) <(cut -d'|' -f1 "$TRABALHO/restaurado.txt" | sort) || true)
          if [ -n "$faltam" ]; then echo "::error::Tabelas que não voltaram no restauro: $faltam"; exit 1; fi
          perfis=$(grep '^public.perfis|' "$TRABALHO/restaurado.txt" | cut -d'|' -f2)
          if [ "${perfis:-0}" -eq 0 ]; then echo "::error::Restauro sem pessoas em public.perfis"; exit 1; fi
          echo "Restauro OK: $(wc -l < "$TRABALHO/restaurado.txt") tabelas, $perfis pessoas."

      - name: Comprimir e encriptar (GPG AES256)
        if: steps.guarda.outputs.fazer == 'sim'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          NOME: ${{ steps.guarda.outputs.nome }}
        run: |
          set -euo pipefail
          cd "$TRABALHO"
          gzip -9 nexus.sql
          # A passphrase entra por um descritor de arquivo: não aparece na linha de comando nem no log
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --compress-algo none \
              --output "$NOME" nexus.sql.gz 3<<< "$BACKUP_PASSPHRASE"
          # Confere que a passphrase abre o arquivo antes de enviar
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt "$NOME" 3<<< "$BACKUP_PASSPHRASE" \
            | gzip -t
          rm nexus.sql.gz
          echo "Arquivo pronto: $NOME ($(du -h "$NOME" | cut -f1))"

      - name: Enviar ao Google Drive e aplicar a retenção
        if: steps.guarda.outputs.fazer == 'sim'
        env:
          NOME: ${{ steps.guarda.outputs.nome }}
        run: |
          set -euo pipefail
          python scripts/backup/drive.py enviar "$TRABALHO/$NOME"
          python scripts/backup/drive.py retencao nexus-backup 30 12

      # O runner é descartado no fim, mas o dump e a credencial saem já do disco
      - name: Limpar arquivos temporários
        if: always()
        run: rm -rf "$TRABALHO" "$GDRIVE_SA_ARQUIVO"

  # Arquivos dos anexos (Storage) — semanal, aos domingos (docs/BACKUP.md §8).
  # Opcional: sem os 4 secrets SUPABASE_S3_* o job só avisa e não falha.
  anexos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      # rclone lê a configuração do remoto "supa" destas variáveis (nada é gravado em arquivo)
      RCLONE_CONFIG_SUPA_TYPE: s3
      RCLONE_CONFIG_SUPA_PROVIDER: Other
      RCLONE_CONFIG_SUPA_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      RCLONE_CONFIG_SUPA_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SUPA_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Configurado e é dia de cópia?
        id: guarda
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for nome in RCLONE_CONFIG_SUPA_ENDPOINT RCLONE_CONFIG_SUPA_REGION RCLONE_CONFIG_SUPA_ACCESS_KEY_ID RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY; do
            if [ -z "${!nome}" ]; then
              echo "::warning::Cópia dos anexos desligada: faltam os secrets SUPABASE_S3_* (docs/BACKUP.md §8)."
              echo "fazer=nao" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          for nome in BACKUP_PASSPHRASE GDRIVE_SERVICE_ACCOUNT_JSON GDRIVE_FOLDER_ID; do
            if [ -z "${!nome}" ]; then echo "::error::Secret $nome não configurado (ver docs/BACKUP.md)"; exit 1; fi
          done
          dia=$(TZ=Europe/Lisbon date +%F)
          echo "nome=nexus-anexos-$dia.tar.gpg" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Só aos domingos, a partir das 3h de Lisboa (a execução das 02:00 UTC no inverno não conta)
            if [ "$(TZ=Europe/Lisbon date +%u)" != "7" ] || [ "$(TZ=Europe/Lisbon date +%-H)" -lt 3 ]; then
              echo "fazer=nao" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          umask 077
          echo "TRABALHO=$RUNNER_TEMP/anexos" >> "$GITHUB_ENV"
          echo "GDRIVE_SA_ARQUIVO=$RUNNER_TEMP/conta-servico.json" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/anexos"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/conta-servico.json"
          echo "fazer=sim" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.guarda.outputs.fazer == 'sim'
        with:
          python-version: '3.12'

      - name: Já tem a cópia desta semana?
        id: existe
        if: steps.guarda.outputs.fazer == 'sim'
        env:
          NOME: ${{ steps.guarda.outputs.nome }}
        run: |
          set -euo pipefail
          pip install --quiet -r scripts/backup/requirements.txt
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(python scripts/backup/drive.py existe "$NOME")" = "sim" ]; then
            echo "A cópia de hoje já está no Drive."; echo "fazer=nao" >> "$GITHUB_OUTPUT"
          else
            echo "fazer=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Copiar o bucket anexos e conferir
        if: steps.existe.outputs.fazer == 'sim'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq rclone > /dev/null
          # Sem nenhum anexo (bucket vazio — ex.: a maioria virou link do Drive na T-52), o rclone não
          # cria a pasta de destino; criamos antes, para o "find" seguinte não falhar.
          mkdir -p "$TRABALHO/anexos"
          rclone copy supa:anexos "$TRABALHO/anexos" --transfers 4 --checkers 8 --stats-log-level NOTICE
          origem=$(rclone size supa:anexos --json | python -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          copiados=$(find "$TRABALHO/anexos" -type f | wc -l)
          echo "Arquivos no Storage: $origem · copiados: $copiados ($(du -sh "$TRABALHO/anexos" | cut -f1))"
          if [ "$copiados" -lt "$origem" ]; then echo "::error::Faltam arquivos na cópia"; exit 1; fi

      - name: Empacotar e encriptar (GPG AES256)
        if: steps.existe.outputs.fazer == 'sim'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          NOME: ${{ steps.guarda.outputs.nome }}
        run: |
          set -euo pipefail
          cd "$TRABALHO"
          # PDFs e imagens já vêm comprimidos: só tar, sem gzip
          tar -cf - anexos | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --compress-algo none --output "$NOME" 3<<< "$BACKUP_PASSPHRASE"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --decrypt "$NOME" 3<<< "$BACKUP_PASSPHRASE" \
            | tar -tf - > /dev/null
          rm -rf anexos
          echo "Arquivo pronto: $NOME ($(du -h "$NOME" | cut -f1))"

      - name: Enviar ao Google Drive e aplicar a retenção
        if: steps.existe.outputs.fazer == 'sim'
        env:
          NOME: ${{ steps.guarda.outputs.nome }}
        run: |
          set -euo pipefail
          python scripts/backup/drive.py enviar "$TRABALHO/$NOME"
          python scripts/backup/drive.py retencao nexus-anexos 8 12

      - name: Limpar arquivos temporários
        if: always()
        run: rm -rf "${TRABALHO:-/nao-existe}" "${GDRIVE_SA_ARQUIVO:-/nao-existe}"
