# Deploy ANTIGO no GitHub Pages — só manual (T-48). A hospedagem passou para o Cloudflare Pages,
# que publica sozinho a cada merge na main (docs/DEPLOY.md). Com o repositório privado no plano
# gratuito do GitHub, o Pages deixa de funcionar; apague este arquivo depois da virada.
name: Deploy (GitHub Pages, legado)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gera environment.ts a partir dos secrets (só chaves públicas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY (Settings → Secrets → Actions)"; exit 1
          fi
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            supabaseUrl: '${SUPABASE_URL}',
            supabaseAnonKey: '${SUPABASE_ANON_KEY}',
            appUrl: '${APP_URL}',
            loginComSenha: false,
          };
          EOF
      - run: npx ng build --configuration production --base-href /${{ github.event.repository.name }}/
      - name: Rotas do Angular no Pages (404.html = index.html)
        run: cp dist/nexus/browser/index.html dist/nexus/browser/404.html
      - name: Nenhuma chave secreta no bundle
        run: bash .github/scripts/sem-segredos.sh dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/nexus/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
