<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gerenciador de Tarefas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral escura do sistema + área de trabalho clara; itens (projeto › tarefa › subtarefa) abrem numa página de duas colunas */
:root{
  --bg:#F6F6FA; --surface:#FFFFFF; --surface-2:#EEEEF5; --fg:#1F1F2B; --muted:#5C6082; --line:#DCDCE6;
  --accent:#7C4DDB; --accent-hover:#6A3DC8; --accent-fg:#FFFFFF; --accent-soft:#EEE7FC;
  --nav:#282A36; --nav-fg:#E6E6F0; --nav-muted:#8C93BA; --nav-active:#3A3C4E; --nav-line:#3A3C4E;
  --todo-bg:#ECECF2; --todo-fg:#3E4157; --prog-bg:#DFF4F8; --prog-fg:#0B6577;
  --bloq-bg:#FDEEDC; --bloq-fg:#8A4B00; --aprov-bg:#FBE6F3; --aprov-fg:#A3236F;
  --done-bg:#E2F6E7; --done-fg:#1D6B35; --info-bg:#E3EEFB; --info-fg:#1F4F8F;
  --danger:#C62828; --danger-bg:#FCE8E8; --warn-bg:#FBF7D5; --warn-fg:#5E5500; --warn-line:#ECE3A0;
  --c1:#7C4DDB; --c2:#0B86A8;
  --pop:#2F3140; --pop-fg:#F8F8F2; --pop-line:#44475A; --pop-muted:#BFC4DE;
  --gold:#F1FA8C; --gold-fg:#21222C; --overlay:rgba(20,20,35,.42); --shadow:0 18px 44px rgba(20,20,35,.18);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#282A36; --surface:#2F3140; --surface-2:#383A4A; --fg:#F8F8F2; --muted:#A4ACCF; --line:#44475A;
  --accent:#BD93F9; --accent-hover:#CDA9FB; --accent-fg:#21222C; --accent-soft:#3B3554;
  --nav:#21222C; --nav-fg:#E6E6F0; --nav-muted:#8C93BA; --nav-active:#343746; --nav-line:#343746;
  --todo-bg:#3A3D4E; --todo-fg:#D6D8E6; --prog-bg:#1F3B45; --prog-fg:#8BE9FD;
  --bloq-bg:#45351F; --bloq-fg:#FFB86C; --aprov-bg:#4A2A42; --aprov-fg:#FF79C6;
  --done-bg:#1F4030; --done-fg:#50FA7B; --info-bg:#233A47; --info-fg:#8BE9FD;
  --danger:#FF5555; --danger-bg:#4A2629; --warn-bg:#3F3E22; --warn-fg:#F1FA8C; --warn-line:#5A5930;
  --c1:#9469E6; --c2:#1F9BC0;
  --pop:#44475A; --pop-fg:#F8F8F2; --pop-line:#6272A4; --pop-muted:#C5CAE6;
  --gold:#F1FA8C; --gold-fg:#21222C; --overlay:rgba(15,16,24,.65); --shadow:0 18px 44px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#282A36; --surface:#2F3140; --surface-2:#383A4A; --fg:#F8F8F2; --muted:#A4ACCF; --line:#44475A;
  --accent:#BD93F9; --accent-hover:#CDA9FB; --accent-fg:#21222C; --accent-soft:#3B3554;
  --nav:#21222C; --nav-fg:#E6E6F0; --nav-muted:#8C93BA; --nav-active:#343746; --nav-line:#343746;
  --todo-bg:#3A3D4E; --todo-fg:#D6D8E6; --prog-bg:#1F3B45; --prog-fg:#8BE9FD;
  --bloq-bg:#45351F; --bloq-fg:#FFB86C; --aprov-bg:#4A2A42; --aprov-fg:#FF79C6;
  --done-bg:#1F4030; --done-fg:#50FA7B; --info-bg:#233A47; --info-fg:#8BE9FD;
  --danger:#FF5555; --danger-bg:#4A2629; --warn-bg:#3F3E22; --warn-fg:#F1FA8C; --warn-line:#5A5930;
  --c1:#9469E6; --c2:#1F9BC0;
  --pop:#44475A; --pop-fg:#F8F8F2; --pop-line:#6272A4; --pop-muted:#C5CAE6;
  --gold:#F1FA8C; --gold-fg:#21222C; --overlay:rgba(15,16,24,.65); --shadow:0 18px 44px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
h2{font-family:var(--f-display);font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.fade{animation:fd .24s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade,.pop{animation:none!important}*{transition:none!important}}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.good{background:var(--done-fg);border-color:var(--done-fg);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* pílulas */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--todo-bg);color:var(--todo-fg)}
.s-afazer{background:var(--todo-bg);color:var(--todo-fg)}
.s-andamento{background:var(--prog-bg);color:var(--prog-fg)}
.s-bloq{background:var(--bloq-bg);color:var(--bloq-fg)}
.s-aprov{background:var(--aprov-bg);color:var(--aprov-fg)}
.s-done{background:var(--done-bg);color:var(--done-fg)}
.s-info{background:var(--info-bg);color:var(--info-fg)}
.s-pend{background:var(--warn-bg);color:var(--warn-fg)}
.s-recus{background:var(--danger-bg);color:var(--danger)}
.s-adm{background:var(--warn-bg);color:var(--warn-fg)}
.lvl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.p-Alta{background:var(--danger)} .p-Média{background:var(--bloq-fg)} .p-Baixa{background:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}

/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login-brand{flex:1 1 420px;background:var(--nav);color:var(--nav-fg);padding-block:56px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-brand h1{font-size:44px;color:#F8F8F2;max-width:14ch}
.login-side{flex:1 1 440px;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--nav-fg);color:var(--nav);display:flex;align-items:center;justify-content:center}

/* shell */
.shell{min-height:100vh;display:flex;flex-wrap:wrap}
.nav{flex:1 1 240px;max-width:100%;background:var(--nav);color:var(--nav-fg);padding-block:22px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px}
.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;border:0;background:transparent;color:var(--nav-fg);font-size:14px;font-weight:500;text-align:left;transition:background .15s}
.nav-item:hover{background:var(--nav-active)}
.nav-item.on{background:var(--nav-active);color:#FFFFFF;font-weight:600}
.count{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--danger);color:#FFFFFF}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--nav-muted)}
.main{flex:999 1 560px;min-width:0;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
@media (min-width:900px){.main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.head-t{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.field-inline{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted)}
.field-inline select{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--fg);height:38px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);border-radius:12px;padding:12px 16px;font-size:14px}

/* listas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}
.tab{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.row{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:13px 20px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;transition:background .15s}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row-main{display:flex;flex-direction:column;gap:3px;flex:1 1 240px;min-width:0}
.row-main strong{font-size:15px}
.row-sub{font-size:13px;color:var(--muted)}
.prazo{font-size:13px;width:84px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.prazo.late{color:var(--danger);font-weight:700}
.empty{padding:28px 20px;color:var(--muted);font-size:14px}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--accent);transform:translateY(-1px)}
.kpi-l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.kpi-v{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th{text-align:left;padding:11px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--accent);transform:translateY(-1px)}

/* página do item */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.crumbs button{border:0;background:transparent;padding:2px 4px;border-radius:6px;color:var(--accent);font-weight:600;font-size:13px}
.crumbs button:hover{background:var(--accent-soft)}
.item-grid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.item-col{flex:2 1 460px;min-width:0;display:flex;flex-direction:column;gap:18px}
.item-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h h3{margin-right:auto}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 12px;align-items:center;font-size:14px}
.kv label{color:var(--muted);font-size:13px}
.kv select,.kv input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%}
.status-set{display:flex;flex-wrap:wrap;gap:6px}
.st-btn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:background .15s}
.st-btn:hover{background:var(--surface-2)}
.st-btn.on.s-afazer{background:var(--todo-fg);color:var(--surface);border-color:transparent}
.st-btn.on.s-andamento{background:var(--prog-fg);color:var(--surface);border-color:transparent}
.st-btn.on.s-bloq{background:var(--bloq-fg);color:var(--surface);border-color:transparent}
.st-btn.on.s-aprov{background:var(--aprov-fg);color:var(--surface);border-color:transparent}
.st-btn.on.s-done{background:var(--done-fg);color:var(--surface);border-color:transparent}
.blocked{background:var(--bloq-bg);border:1px solid color-mix(in srgb,var(--bloq-fg) 25%,transparent);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.blocked .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--bloq-fg)}
.child{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%;transition:background .15s,border-color .15s}
.child:hover{background:var(--surface-2);border-color:var(--accent)}
.solic-card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%;transition:background .15s}
.solic-card:hover{background:var(--surface-2)}
.file{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.com{display:flex;gap:10px}
.com-b{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}

/* texto formatado */
.rich{font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.rich p,.rich div{margin:0 0 6px}
.rich ul,.rich ol{margin:4px 0 8px;padding-left:22px}
.rich h3{font-size:16px;margin:8px 0 4px}
.rich blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--muted)}
.rich img{max-width:100%;border-radius:8px;display:block;margin:6px 0}
.rich a{color:var(--accent);text-decoration:underline}
.rich:empty::before{content:attr(data-ph);color:var(--muted)}
.rte{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;position:relative}
.rte:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rte-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rte-bar button{width:32px;height:32px;border:0;border-radius:6px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);font-size:14px}
.rte-bar button:hover{background:var(--surface)}
.rte-bar button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.rte-bar button{transition:background .12s,color .12s}
.rte-bar .sep{width:1px;background:var(--line);margin:4px 3px}
.rte-ed{min-height:84px;max-height:360px;overflow-y:auto;padding:10px 12px;outline:none}
.rte-pop{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface-2)}
.rte-pop input{flex:1 1 200px;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface)}

/* solicitações */
.sol-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sol-list{flex:1 1 360px;min-width:0}
.sol-detail{flex:1.4 1 440px;min-width:0;padding:22px;display:flex;flex-direction:column;gap:18px}
.srow{width:100%;display:flex;flex-direction:column;gap:6px;padding:14px 18px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;transition:background .15s}
.srow:first-child{border-top:0}
.srow:hover{background:var(--surface-2)}
.srow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.origin{border:1px solid color-mix(in srgb,var(--info-fg) 25%,var(--line));background:var(--info-bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.me .bubble{background:var(--accent-soft);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.bubble .who{font-size:12px;font-weight:700;margin-bottom:4px}
.bubble .who span{font-weight:500;color:var(--muted)}

/* camadas */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.pop{animation:pp .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pp{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.fld input,.fld select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-weight:400;font-size:14px}
.fld-row{display:flex;flex-wrap:wrap;gap:12px}
.fld-row .fld{flex:1 1 160px}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--pop);color:var(--pop-fg);border:1px solid var(--pop-line);padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.mention{display:inline-block;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap;text-decoration:none}
#mention-pop{position:fixed;z-index:50;width:280px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;animation:pp .14s ease both}
#mention-pop .mh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}

  var lines = series.map(function(se){

    var li = se.vals.length - 1;

      '<text x="' + (x(li) + 10) + '" y="' + (y(se.vals[li]) + 4 + (se.off || 0)) + '" style="fill:var(--fg);font-size:12px;font-weight:600">' + esc(se.name) + ': ' + se.vals[li] + '</text>';

function renderLayer(){
  var L = document.getElementById('layer');
  var keepModal = L.querySelector('.modal') && S.modal;
  var toast = S.toast ? '<div class="toast fade" role="status">' + esc(S.toast) + '</div>' : '';
  if (keepModal) { var t = L.querySelector('.toast'); if (t) t.remove(); if (toast) L.insertAdjacentHTML('beforeend', toast); return; }
  L.innerHTML = viewModal() + toast;
  var f = L.querySelector('#m-nome'); if (f) f.focus();
}
function go(tela, extra){ Object.assign(S, {tela:tela, modal:null, editDesc:false, editMotivo:false}, extra || {}); render(); window.scrollTo({top:0, behavior:'smooth'}); }
function setItem(id, patch){ Object.assign(I(id), patch); }

function resolver(sa, novo){
  sa.status = novo;
  sa.msgs.push({u:S.conta, q:'agora', t:'<p>Solicitação marcada como <b>' + novo.toLowerCase() + '</b>.</p>'});
  if (!pend(sa.item).length) setItem(sa.item, {status:'Em andamento', motivo:'', dias:0});
  flash(novo === 'Recusada' ? 'Recusada. O solicitante foi avisado por e-mail.' : 'Feito. O item voltou para "Em andamento" e o solicitante foi avisado.');
  render();
}

function applyStatus(id, s){
  var it = I(id);
  if (!it || s === it.status) return;
